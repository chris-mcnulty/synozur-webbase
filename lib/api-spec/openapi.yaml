            - viewsAllTime
            - comments
          properties:
            views:
              type: integer
            viewsAllTime:
              type: integer
            comments:
              type: integer
        series:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSeriesPoint'
        referrers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsReferrer'
    CwvMetricName:
      description: One of the five Core Web Vitals metric names emitted by web-vitals.
      type: string
      enum:
        - LCP
        - INP
        - CLS
        - FCP
        - TTFB
    CwvRating:
      description: web-vitals' three-bucket rating for a metric value.
      type: string
      enum:
        - good
        - needs-improvement
        - poor
    CwvSampleInput:
      type: object
      required:
        - route
        - metric
        - value
        - rating
      properties:
        route:
          description: The visitor's pathname at sample time (no host, no query).
          type: string
          minLength: 1
          maxLength: 256
        metric:
          $ref: '#/components/schemas/CwvMetricName'
        value:
          description: Metric value (milliseconds for time-based metrics, unitless for CLS).
          type: number
          minimum: 0
        rating:
          $ref: '#/components/schemas/CwvRating'
        navigationType:
          type:
            - string
            - 'null'
        metricId:
          type:
            - string
            - 'null'
    SiteHealthCwvRow:
      type: object
      required:
        - route
        - metric
        - sampleCount
        - p50
        - p75
        - p90
      properties:
        route:
          type: string
        metric:
          $ref: '#/components/schemas/CwvMetricName'
        sampleCount:
          type: integer
        p50:
          type: number
        p75:
          type: number
        p90:
          type: number
    SiteHealthAltCoverage:
      type: object
      required:
        - totalImageMedia
        - placeholderCount
        - reviewedCount
        - coverageRatio
      properties:
        totalImageMedia:
          type: integer
        placeholderCount:
          description: >-
            Rows whose alt text matches the deterministic "Image: …"
            placeholder pattern.
          type: integer
        reviewedCount:
          type: integer
        coverageRatio:
          description: reviewedCount / totalImageMedia. 0 when total is 0.
          type: number
    SiteHealthRedirectRow:
      type: object
      required:
        - id
        - sourcePath
        - targetPath
        - statusCode
        - active
        - hitCount
      properties:
        id:
          type: string
        sourcePath:
          type: string
        targetPath:
          type: string
        statusCode:
          type: integer
        active:
          type: boolean
        hitCount:
          type: integer
        lastHitAt:
          type:
            - string
            - 'null'
          format: date-time
    SiteHealthRedirects:
      type: object
      required:
        - totalActive
        - totalHits
        - top
        - chains
      properties:
        totalActive:
          type: integer
        totalHits:
          description: Sum of `hit_count` across all active redirects.
          type: integer
        top:
          description: Up to 10 most-hit active redirects.
          type: array
          items:
            $ref: '#/components/schemas/SiteHealthRedirectRow'
        chains:
          description: Redirects whose target is itself the source of another redirect (one-hop chain detection).
          type: array
          items:
            $ref: '#/components/schemas/SiteHealthRedirectRow'
    SiteHealthSnapshot:
      type: object
      required:
        - generatedAt
        - windowDays
        - cwv
        - altText
        - redirects
      properties:
        generatedAt:
          type: string
          format: date-time
        windowDays:
          type: integer
        cwv:
          type: array
          items:
            $ref: '#/components/schemas/SiteHealthCwvRow'
        altText:
          $ref: '#/components/schemas/SiteHealthAltCoverage'
        redirects:
          $ref: '#/components/schemas/SiteHealthRedirects'
    PublishBlock:
      type: object
      required:
        - id
        - artifactKind
        - sourceRule
        - severity
        - reason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        artifactKind:
          description: >-
            'collateral' | 'route' | 'media' | 'site' (free-form so new
            rules can name new kinds without a schema migration).
          type: string
        artifactId:
          type:
            - string
            - 'null'
        sourceRule:
          description: Stable rule identifier, e.g. `cwv.lcp.p75`, `alt-text.placeholder`.
          type: string
        severity:
          description: '`warning` in v0 (warn-mode); `block` reserved for hard-mode follow-up.'
          type: string
        reason:
          type: string
        evidence:
          type:
            - object
            - 'null'
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
        resolvedBy:
          type:
            - string
            - 'null'
          format: uuid
        resolutionNote:
          type:
            - string
            - 'null'
    PublishBlockListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishBlock'
    PublishBlockScanResult:
      type: object
      required:
        - inserted
        - retained
        - autoResolved
        - total
      properties:
        inserted:
          type: integer
        retained:
          type: integer
        autoResolved:
          type: integer
        total:
          type: integer
    PublishBlockResolveBody:
      type: object
      required:
        - resolutionNote
      properties:
        resolutionNote:
          type: string
          minLength: 1
          maxLength: 1000
