  /traffic/ingest:
    post:
      operationId: ingestTrafficBatch
      tags:
        - Traffic
      summary: Ingest a batch of pageviews from a sister Synozur web property (#228)
      description: |
        Authenticated batched-pageview ingest. The caller authenticates with
        `Authorization: Bearer <api-key>` where the key was issued from the
        admin Traffic Properties page. Each row is normalized and stored
        with the matched property's slug as `source_system`.

        The endpoint is idempotent on `(source_system, sessionKey, path,
        viewedAt)` — sister apps that retry a batch will not double-count.
      security:
        - trafficPropertyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Batch envelope. At least one of `rows`, `pageviews`, `sessions`,
                or `events` must be present. `rows` is a deprecated alias for
                `pageviews` retained for backward compatibility.
              properties:
                propertySlug:
                  type: string
                  description: Optional; if supplied must equal the slug bound to the API key (else 403).
                rows:
                  type: array
                  deprecated: true
                  maxItems: 50000
                  items: { $ref: '#/components/schemas/IngestPageviewRow' }
                pageviews:
                  type: array
                  maxItems: 50000
                  items: { $ref: '#/components/schemas/IngestPageviewRow' }
                sessions:
                  type: array
                  maxItems: 50000
                  items: { $ref: '#/components/schemas/IngestSessionRow' }
                events:
                  type: array
                  maxItems: 50000
                  items: { $ref: '#/components/schemas/IngestEventRow' }
      responses:
        '202':
          description: Batch accepted (per-row outcomes in the body)
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, skipped, errors, rowsParsed, propertySlug, errorSamples]
                properties:
                  accepted: { type: integer, description: Pageviews accepted }
                  duplicates: { type: integer, description: Pageviews ignored as duplicates }
                  skipped: { type: integer }
                  errors: { type: integer }
                  sessionsAccepted: { type: integer }
                  sessionsUpdated: { type: integer }
                  eventsAccepted: { type: integer }
                  eventsDuplicates: { type: integer }
                  rowsParsed: { type: integer }
                  sessionsParsed: { type: integer }
                  eventsParsed: { type: integer }
                  propertySlug: { type: string }
                  errorSamples:
                    type: array
                    items:
                      type: object
                      required: [index, reason]
                      properties:
                        index: { type: integer }
                        reason: { type: string }
        '403':
          description: propertySlug in body did not match the authenticated API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limit exceeded for this property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

