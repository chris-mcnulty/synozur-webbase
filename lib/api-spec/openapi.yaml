      properties:
        id:
          type: string
        sourcePath:
          type: string
        targetPath:
          type: string
        statusCode:
          type: integer
        active:
          type: boolean
        hitCount:
          type: integer
        lastHitAt:
          type:
            - string
            - 'null'
