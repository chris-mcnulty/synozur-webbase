    OpeningHoursSpec:
      description: >
        One row of the LocalBusiness `openingHoursSpecification` array. `days`
        is a list of `Monday`-style schema.org day names; `opens`/`closes` are
        `HH:MM` 24-hour times.
      type: object
      required: [days, opens, closes]
      properties:
        days:
          type: array
          minItems: 1
          items:
            type: string
            enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        opens:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
