                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: While running, only overrides may change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [AdminExperiments]
      operationId: deleteAdminExperimentVariant
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Variants can be deleted only while draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    trafficPropertyApiKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Per-property API key issued from the admin Traffic Properties page.
        Sent as `Authorization: Bearer <key>` to /api/traffic/ingest.
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    IngestPageviewRow:
      type: object
      required: [sessionKey, path, viewedAt]
      properties:
        sessionKey: { type: string }
        path: { type: string }
        title: { type: string, nullable: true }
        viewedAt: { type: string, format: date-time }
        pageviewCount: { type: integer, minimum: 1 }
        timeOnPageMs: { type: integer, nullable: true }
        pageType: { type: string, nullable: true }
        referrerUrl: { type: string, nullable: true }
        referrerHost: { type: string, nullable: true }
        trafficSource:
          type: string
          nullable: true
          enum: [direct, organic, ai, referral, social, paid, internal]
        deviceType:
          type: string
          nullable: true
          enum: [desktop, mobile, tablet, bot]
        browserName: { type: string, nullable: true }
        osName: { type: string, nullable: true }
        userAgent: { type: string, nullable: true, description: 'When set, the server fills missing browser/os/device/bot fields.' }
        country: { type: string, nullable: true }
        utmSource: { type: string, nullable: true }
        utmMedium: { type: string, nullable: true }
        utmCampaign: { type: string, nullable: true }
    IngestSessionRow:
      type: object
      required: [sessionKey]
      description: |
        Session-only metadata. Use to backfill / override session attributes
        independently of pageviews. Idempotent on (propertySlug, sessionKey).
      properties:
        sessionKey: { type: string }
        firstSeenAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        userAgent: { type: string, nullable: true }
        browserName: { type: string, nullable: true }
        browserVersion: { type: string, nullable: true }
        osName: { type: string, nullable: true }
        deviceType:
          type: string
          nullable: true
          enum: [desktop, mobile, tablet, bot]
        country: { type: string, nullable: true }
        region: { type: string, nullable: true }
        city: { type: string, nullable: true }
        landingPath: { type: string, nullable: true }
        referrerUrl: { type: string, nullable: true }
        referrerHost: { type: string, nullable: true }
        trafficSource:
          type: string
          nullable: true
          enum: [direct, organic, ai, referral, social, paid, internal]
        utmSource: { type: string, nullable: true }
        utmMedium: { type: string, nullable: true }
        utmCampaign: { type: string, nullable: true }
        utmTerm: { type: string, nullable: true }
        utmContent: { type: string, nullable: true }
        isBot: { type: boolean, nullable: true }
        botName: { type: string, nullable: true }
        botCategory: { type: string, nullable: true }
    IngestEventRow:
      type: object
      required: [sessionKey, eventName, occurredAt]
      description: Custom event bound to a session by (propertySlug, sessionKey).
      properties:
        sessionKey: { type: string }
        eventName: { type: string }
        occurredAt: { type: string, format: date-time }
        path: { type: string, nullable: true }
        eventCategory: { type: string, nullable: true }
        eventValue: { type: number, nullable: true }
        properties:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details: {}
    PortalForbidden:
      type: object
      required:
        - error
        - reason
      properties:
        error:
          type: string
        reason:
          type: string
          enum:
            - not_a_customer
            - no_organization
            - organization_inactive
    PortalUserSummary:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    PortalAccountTeamMember:
      allOf:
        - $ref: '#/components/schemas/PortalUserSummary'
        - type: object
          required:
            - role
          properties:
            role:
              type: string
              enum:
                - account_manager
                - primary_contact
    PortalOrganization:
      type: object
      required:
        - id
        - name
        - slug
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
    PortalMe:
      type: object
      required:
        - user
        - organization
        - accountTeam
      properties:
        user:
          $ref: '#/components/schemas/PortalUserSummary'
        organization:
          $ref: '#/components/schemas/PortalOrganization'
        accountTeam:
          type: array
          items:
            $ref: '#/components/schemas/PortalAccountTeamMember'
    PortalDocument:
      type: object
      required:
        - id
        - engagementId
        - engagementTitle
        - engagementSlug
        - filename
        - contentType
        - sizeBytes
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        engagementTitle:
          type: string
        engagementSlug:
          type: string
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        lastModifiedAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        hasPreview:
          type: boolean
          description: True when the document has an in-browser viewer available via GET /portal/documents/{id}/preview (audited, server-side redirect to the M365 viewer for SPE-backed Office files). Clients should never receive the raw SPE webUrl.
        historyHidden:
          type: boolean
          description: True when the admin has hidden version history from the customer. The /versions endpoint will return an empty list and per-version downloads will 404.
    PortalDocumentVersion:
      type: object
      required:
        - versionId
        - sizeBytes
        - isCurrent
      properties:
        versionId:
          type: string
          description: SharePoint Embedded version label (e.g. "1.0", "2.0"). Pass to the per-version download endpoint as `{versionId}`.
        lastModifiedAt:
          type: string
          format: date-time
          nullable: true
        sizeBytes:
          type: integer
          format: int64
        modifiedByDisplayName:
          type: string
          nullable: true
        isCurrent:
          type: boolean
          description: True for the version that matches the live driveItem.
    PortalDocumentVersionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalDocumentVersion'
    PortalDocumentList:
