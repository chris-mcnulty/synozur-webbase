        sampleCount:
          type: integer
        p50:
          type: number
        p75:
          type: number
        p90:
          type: number
    SiteHealthAltCoverage:
      type: object
      required:
        - totalImageMedia
        - placeholderCount
        - reviewedCount
        - coverageRatio
      properties:
        totalImageMedia:
          type: integer
        placeholderCount:
          description: >-
            Rows whose alt text matches the deterministic "Image: …"
            placeholder pattern.
          type: integer
        reviewedCount:
          type: integer
        coverageRatio:
          description: reviewedCount / totalImageMedia. 0 when total is 0.
          type: number
    SiteHealthRedirectRow:
      type: object
      required:
        - id
        - sourcePath
        - targetPath
        - statusCode
        - active
