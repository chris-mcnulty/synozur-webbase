        - INP
        - CLS
        - FCP
        - TTFB
    CwvRating:
      description: web-vitals' three-bucket rating for a metric value.
      type: string
      enum:
        - good
        - needs-improvement
        - poor
    CwvSampleInput:
      type: object
      required:
        - route
        - metric
        - value
        - rating
      properties:
        route:
          description: The visitor's pathname at sample time (no host, no query).
          type: string
          minLength: 1
          maxLength: 256
        metric:
          $ref: '#/components/schemas/CwvMetricName'
        value:
          description: Metric value (milliseconds for time-based metrics, unitless for CLS).
          type: number
          minimum: 0
        rating:
          $ref: '#/components/schemas/CwvRating'
        navigationType:
          type:
            - string
            - 'null'
        metricId:
          type:
            - string
            - 'null'
    SiteHealthCwvRow:
      type: object
