openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Events
    description: Public and admin event endpoints.
  - name: Assets
    description: Image asset library.
  - name: Admin
    description: Admin authentication helpers.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [Admin]
      summary: Returns current admin user info if authorized
      responses:
        "200":
          description: Admin user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List uploaded image assets
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Register a newly-uploaded asset in the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /assets/{id}:
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: Delete an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /events:
    get:
      tags: [Events]
      operationId: listPublicEvents
      summary: List public events
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicEvent"
  /admin/events:
    get:
      tags: [Events]
      operationId: listAdminEvents
      summary: List events (admin)
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEvent"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEvent"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/events/{id}:
    get:
      tags: [Events]
      operationId: getAdminEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Events]
      operationId: updateEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Events]
      operationId: deleteEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /forms/contact:
    post:
      tags: [Forms]
      operationId: submitContact
      summary: Submit the public contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormInput"
      responses:
        "200":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmissionAck"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /forms/subscribe:
    post:
      tags: [Forms]
      operationId: submitSubscribe
      summary: Submit a newsletter subscribe request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeFormInput"
      responses:
        "200":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmissionAck"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /forms/start:
    post:
      tags: [Forms]
      operationId: submitStart
      summary: Submit the Get Started intake form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFormInput"
      responses:
        "200":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmissionAck"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    AdminUser:
      type: object
      required: [userId, email, authorized]
      properties:
        userId:
          type: string
        email:
          type: string
        authorized:
          type: boolean
    Asset:
      type: object
      required: [id, filename, originalName, mimeType, size, storageKey, uploadedAt]
      properties:
        id:
          type: integer
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        storageKey:
          type: string
        uploadedBy:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time
    AssetInput:
      type: object
      required: [originalName, mimeType, size, storageKey]
      properties:
        originalName:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        storageKey:
          type: string
          minLength: 1
    PublicEvent:
      type: object
      required: [id, title, slug, startDate, status]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        startDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        registrationUrl:
          type: ["string", "null"]
        registrationStatus:
          type: string
        eventType:
          type: string
        status:
          type: string
        imageUrl:
          type: ["string", "null"]
    AdminEvent:
      type: object
      required: [id, title, slug, startDate, status, registrationStatus, eventType]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        startDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        registrationUrl:
          type: ["string", "null"]
        registrationStatus:
          type: string
        eventType:
          type: string
        status:
          type: string
        imageAssetId:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FormSubmissionAck:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
        id:
          type: integer
    ContactFormInput:
      type: object
      required: [name, company, email, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        company:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        message:
          type: string
          minLength: 10
          maxLength: 5000
        turnstileToken:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
          description: Honeypot field — must be empty.
    SubscribeFormInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        source:
          type: ["string", "null"]
          description: Optional originating surface (e.g. footer, insights).
        turnstileToken:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
          description: Honeypot field — must be empty.
    StartFormInput:
      type: object
      required: [name, role, company, email, pillar, timeline, budget, brief]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        role:
          type: string
          minLength: 2
          maxLength: 200
        company:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        pillar:
          type: string
          minLength: 2
          maxLength: 200
        timeline:
          type: string
          minLength: 2
          maxLength: 200
        budget:
          type: string
          minLength: 2
          maxLength: 200
        brief:
          type: string
          minLength: 20
          maxLength: 8000
        turnstileToken:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
          description: Honeypot field — must be empty.
    EventInput:
      type: object
      required: [title, startDate]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: ["string", "null"]
        startDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        registrationUrl:
          type: ["string", "null"]
        registrationStatus:
          type: string
        eventType:
          type: string
        status:
          type: string
        imageAssetId:
          type: ["integer", "null"]
