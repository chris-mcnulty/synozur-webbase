components:
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details: {}
    RoleName:
      type: string
      enum:
        - admin
        - editor
        - author
        - contributor
    PostStatus:
      type: string
      enum:
        - draft
        - scheduled
        - published
        - archived
    CommentStatus:
      type: string
      enum:
        - pending
        - approved
        - spam
        - deleted
    CurrentUser:
      type: object
      required:
        - id
        - roles
      properties:
        id:
          type: string
          format: uuid
        externalSubject:
          type: string
          nullable: true
        authProvider:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
    CmsUser:
      type: object
      required:
        - id
        - roles
      properties:
        id:
          type: string
          format: uuid
        externalSubject:
          type: string
          nullable: true
        authProvider:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        createdAt:
          type: string
          format: date-time
    Category:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
    UpsertCategoryBody:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
    Tag:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    UpsertTagBody:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    MediaItem:
      type: object
      required:
        - id
        - storageKey
        - publicUrl
        - altText
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        storageKey:
          type: string
        publicUrl:
          type: string
        mime:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        byteSize:
          type: integer
          nullable: true
        altText:
          description: >-
            Required. Backfilled to a deterministic placeholder
            (`Image: <name>`) for legacy rows; the admin asset library
            surfaces a "needs review" badge for placeholder values.
          type: string
          minLength: 1
        originalName:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        uploadedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    MediaListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    RegisterMediaBody:
      type: object
      required:
        - storageKey
        - publicUrl
        - altText
      properties:
        storageKey:
          type: string
          minLength: 1
        publicUrl:
          type: string
          minLength: 1
        mime:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        byteSize:
          type: integer
          nullable: true
        altText:
          description: >-
            Required. Describe the image so screen readers and
            accessibility audits have meaningful content. Pre-fill from
            the file name at upload time and prompt the editor to
            improve before publish.
          type: string
          minLength: 1
        originalName:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
    UpdateMediaBody:
      type: object
      properties:
        altText:
          description: >-
            When provided must be a non-empty string. Omit to leave
            the existing alt text unchanged.
          type: string
          minLength: 1
        mime:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        originalName:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
    AssetCategory:
      type: object
      required:
        - id
        - slug
        - label
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        label:
          type: string
        sortOrder:
          type: integer
        count:
          type: integer
