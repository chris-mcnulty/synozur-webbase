openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Authentication and current user
  - name: CMS Posts
    description: Insights post management (authoring)
  - name: CMS Categories
    description: Category management
  - name: CMS Tags
    description: Tag management
  - name: CMS Comments
    description: Comment moderation
  - name: CMS Media
    description: Media management
  - name: CMS Users
    description: User and role management (admin only)
  - name: Insights
    description: Public Insights reading endpoints
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: Events
    description: Public and admin event endpoints.
  - name: Assets
    description: Image asset library.
  - name: Admin
    description: Admin authentication helpers.
  - name: SiteSettings
    description: Public site settings.
  - name: Services
    description: Public services, solutions, methodologies and capabilities.
  - name: CmsServices
    description: Admin service, solution, methodology and capability management.
  - name: Team
    description: Team member roster (public + admin).
  - name: CmsCollateral
    description: Admin endpoints for managing collateral library items.
  - name: CMS Analytics
    description: Aggregate analytics for posts and dashboard.
  - name: Metrics
    description: Public real-user performance telemetry.
  - name: SiteHealth
    description: Admin site health (Core Web Vitals, alt-text coverage, redirects).
  - name: PublishBlocks
    description: Quality blocks surfaced on edit pages (warn-mode v0).
  - name: Polaris
    description: Public Polaris podcast episode endpoints.
  - name: CmsPolaris
    description: Admin Polaris podcast episode management.
  - name: Portal
    description: Galaxy customer portal — same-host session bridge.
  - name: PortalApps
    description: Galaxy per-application cockpit surfaces (#226).
  - name: Traffic
    description: Multi-property traffic ingest (#228).
  - name: Experiments
    description: Public A/B experiments runtime endpoints.
  - name: AdminExperiments
    description: Admin A/B experiments CRUD, lifecycle, and results.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Returns the current authenticated user with roles
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cms/posts:
    get:
      operationId: listCmsPosts
      tags:
        - CMS Posts
      summary: List posts (admin)
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PostStatus'
        - in: query
          name: authorId
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [title, author, publishedAt, updatedAt]
            default: publishedAt
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Page of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCmsPost
      tags:
        - CMS Posts
      summary: Create a draft post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cms/posts/{id}:
    get:
      operationId: getCmsPost
      tags:
        - CMS Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCmsPost
      tags:
        - CMS Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCmsPost
      tags:
        - CMS Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted (soft delete)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cms/posts/{id}/publish:
    post:
      operationId: publishCmsPost
      tags:
        - CMS Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cms/posts/{id}/schedule:
    post:
      operationId: scheduleCmsPost
      tags:
        - CMS Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scheduledFor
              properties:
                scheduledFor:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cms/posts/{id}/archive:
    post:
      operationId: archiveCmsPost
      tags:
        - CMS Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cms/posts/{id}/revisions:
    get:
      operationId: listCmsPostRevisions
      tags:
        - CMS Posts
      summary: List revisions for a post (most recent first)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cms/posts/{id}/revisions/{revisionId}:
    get:
      operationId: getCmsPostRevision
      tags:
        - CMS Posts
      summary: Fetch a single revision with full snapshot content (for preview + diff)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: revisionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revision detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRevisionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cms/posts/{id}/revisions/{revisionId}/restore:
    post:
      operationId: restoreCmsPostRevision
      tags:
        - CMS Posts
      summary: Restore a post to a previous revision (snapshots current state first)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: revisionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cms/categories:
    get:
      operationId: listCmsCategories
      tags:
        - CMS Categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      operationId: createCmsCategory
      tags:
        - CMS Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCategoryBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cms/categories/{id}:
    patch:
      operationId: updateCmsCategory
      tags:
        - CMS Categories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCategoryBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCmsCategory
      tags:
        - CMS Categories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cms/tags:
    get:
      operationId: listCmsTags
      tags:
        - CMS Tags
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      operationId: createCmsTag
      tags:
        - CMS Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTagBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
  /cms/tags/{id}:
    patch:
      operationId: updateCmsTag
      tags:
        - CMS Tags
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTagBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
    delete:
      operationId: deleteCmsTag
      tags:
        - CMS Tags
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /cms/media:
    get:
      operationId: listCmsMedia
      tags:
        - CMS Media
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
    post:
      operationId: registerCmsMedia
      tags:
        - CMS Media
      summary: Register an uploaded media object (after presigned upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMediaBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cms/media/{id}:
    patch:
      operationId: updateCmsMedia
      tags:
        - CMS Media
      summary: Update editable metadata for a media item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCmsMedia
      tags:
        - CMS Media
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cms/comments:
    get:
      operationId: listCmsComments
      tags:
        - CMS Comments
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/CommentStatus'
        - in: query
          name: postId
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Comments page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
  /cms/comments/{id}/moderate:
    post:
      operationId: moderateCmsComment
      tags:
        - CMS Comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - reject
                    - spam
                    - delete
      responses:
        '200':
          description: Moderated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /cms/audit-log:
    get:
      tags: [CMS]
      operationId: listAuditLog
      summary: List audit-log entries (#258)
      description: >
        Cursor-paginated, filterable feed of `audit_log` rows. Any CMS role
        can read; the per-entity activity tab on artifact edit pages calls
        this with `entity` + `entityId`. The global viewer page is nav-gated
        to admins via the `users.manage` capability, but the endpoint itself
        accepts editor / author / contributor too.
      parameters:
        - in: query
          name: actorId
          schema: { type: string, format: uuid }
        - in: query
          name: actorEmail
          schema: { type: string }
        - in: query
          name: entity
          schema: { type: string }
        - in: query
          name: entityId
          schema: { type: string }
        - in: query
          name: actionPrefix
          description: Matches rows whose `action` begins with this value (e.g. `auth.`, `post.`).
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Page of audit log entries
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, action, entity, at]
                      properties:
                        id: { type: string, format: uuid }
                        actorId:
                          type: [string, 'null']
                          format: uuid
                        actorEmail:
                          type: [string, 'null']
                        actorDisplayName:
                          type: [string, 'null']
                        action: { type: string }
                        entity: { type: string }
                        entityId:
                          type: [string, 'null']
                        diff:
                          description: >
                            Structured `{ before, after }` diff produced by
                            `buildAuditDiff()`; null when no diff was captured.
                          type: [object, 'null']
                          additionalProperties: true
                        at: { type: string, format: date-time }
                  nextCursor:
                    type: [string, 'null']
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /cms/audit-log.csv:
    get:
      tags: [CMS]
      operationId: exportAuditLogCsv
      summary: Export audit-log entries as CSV (#258)
      description: >
        Same filters as `GET /cms/audit-log`, returning up to 10,000 rows in
        CSV form. Admin-only since this is the compliance / legal-handoff
        path.
      parameters:
        - in: query
          name: actorId
          schema: { type: string, format: uuid }
        - in: query
          name: actorEmail
          schema: { type: string }
        - in: query
          name: entity
          schema: { type: string }
        - in: query
          name: entityId
          schema: { type: string }
        - in: query
          name: actionPrefix
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /cms/users:
    get:
      operationId: listCmsUsers
      tags:
        - CMS Users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CmsUser'
  /cms/users/{id}/roles:
    put:
      operationId: setCmsUserRoles
      tags:
        - CMS Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roles
              properties:
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/RoleName'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsUser'
  /cms/analytics/overview:
    get:
      operationId: getCmsAnalyticsOverview
      tags:
        - CMS Analytics
      summary: Dashboard analytics overview
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cms/analytics/batch-views:
    get:
      operationId: getCmsBatchViews
      tags:
        - CMS Analytics
      summary: Batch view counts for multiple posts (last N days)
      parameters:
        - in: query
          name: postIds
          required: true
          schema:
            type: string
          description: Comma-separated list of post UUIDs (max 100)
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: View counts keyed by post ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchViewsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cms/analytics/posts/{id}:
    get:
      operationId: getCmsPostAnalytics
      tags:
        - CMS Analytics
      summary: Per-post analytics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Post analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /insights/{slug}/view:
    post:
      operationId: trackInsightView
      tags:
        - Insights
      summary: Record a public post view
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                referrer:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
