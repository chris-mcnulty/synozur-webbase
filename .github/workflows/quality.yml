name: Quality

# #142 Phase C — Pre-merge gates.
#
# Two jobs:
#   * `typecheck-build` runs on every push and pull request. It is the
#     baseline gate — fast, no external services, safe to mark required.
#   * `e2e-and-lighthouse` runs the Playwright + axe + Lighthouse harness
#     against a fully provisioned dev stack. It is currently behind
#     `workflow_dispatch` (manual trigger) until the team wires DB
#     seeding into the runner or points it at a stable staging URL.
#     Flip the trigger to `pull_request` once that's stable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: >-
          Optional override for the URL the e2e+lighthouse job hits.
          Leave blank to boot a local stack inside the runner.
        required: false
        default: ""

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs)
        run: pnpm run typecheck:libs

      - name: Typecheck (workspaces)
        run: |
          pnpm --filter "@workspace/api-server" run typecheck || true
          pnpm --filter "@workspace/synozur" run typecheck || true
        # Some pre-existing TS errors are inherited from before the
        # quality gate was introduced (see #142 Phase C commit notes).
        # The libs pass is the strict gate; per-workspace runs are
        # informational until that backlog is cleaned up.

      - name: Build api-server
        run: pnpm --filter "@workspace/api-server" run build
        env:
          # The api-server build needs a DATABASE_URL declared even when
          # nothing actually connects (Drizzle config reads it eagerly).
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub

      - name: Build synozur
        run: pnpm --filter "@workspace/synozur" run build
        env:
          PORT: "5000"
          BASE_PATH: "/"

  lighthouse:
    name: Lighthouse CI
    # Runs on every PR and on push to main so perf/SEO regressions block
    # merge instead of waiting for someone to manually dispatch the
    # `e2e-and-lighthouse` job. Boots the same stack as that job, but
    # scoped to LHCI only (no Playwright) so the per-PR cost stays low.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: synozur
          POSTGRES_PASSWORD: synozur
          POSTGRES_DB: synozur
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://synozur:synozur@localhost:5432/synozur

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Provision database
        run: pnpm --filter "@workspace/db" run push

      - name: Boot api-server
        env:
          PORT: "8000"
          NODE_ENV: production
        run: |
          pnpm --filter "@workspace/api-server" run build
          pnpm --filter "@workspace/api-server" run start &
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/healthz >/dev/null; then
              echo "api-server up"
              exit 0
            fi
            sleep 2
          done
          echo "api-server did not start in time" >&2
          exit 1

      - name: Build + preview synozur
        env:
          PORT: "5000"
          BASE_PATH: "/"
          E2E_API_PROXY_TARGET: "http://localhost:8000"
        run: |
          pnpm --filter "@workspace/synozur" run build
          pnpm --filter "@workspace/synozur" run serve &
          for i in {1..30}; do
            if curl -sf http://localhost:5000/ >/dev/null; then
              echo "synozur up"
              exit 0
            fi
            sleep 2
          done
          echo "synozur did not start in time" >&2
          exit 1

      - name: Run Lighthouse CI
        id: lhci
        # Don't fail the step yet — we want the summary + artifact upload
        # to run even when assertions block. The dedicated assertion-gate
        # step below converts the saved exit code into the job result.
        run: |
          set +e
          pnpm exec lhci autorun --config=./lighthouserc.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Build PR summary
        if: always()
        run: pnpm --filter "@workspace/scripts" run lighthouse:pr-summary

      - name: Upload Lighthouse HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/*.html
            .lighthouseci/*.json
            .lighthouseci/manifest.json
            .lighthouseci/assertion-results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Post sticky PR comment
        # Skip on fork PRs — `GITHUB_TOKEN` doesn't get write access to
        # pull-request conversations from forks, and a permission error
        # here would otherwise fail an otherwise-green Lighthouse run.
        # Same-repo PRs still get the sticky comment.
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-ci
          path: lhci-pr-summary.md

      - name: Enforce Lighthouse assertions
        if: always()
        run: |
          code="${{ steps.lhci.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "Lighthouse CI assertions failed (exit $code)" >&2
            exit "$code"
          fi

  e2e-and-lighthouse:
    name: E2E + Lighthouse
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: synozur
          POSTGRES_PASSWORD: synozur
          POSTGRES_DB: synozur
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://synozur:synozur@localhost:5432/synozur
      E2E_BASE_URL: ${{ github.event.inputs.e2e_base_url || 'http://localhost:5000' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter "@workspace/synozur" exec playwright install --with-deps chromium

      # When the workflow is dispatched without an external E2E_BASE_URL,
      # bring the full stack up inside the runner. The team can swap this
      # out for a staging-URL-only mode by setting the input.
      - name: Provision database
        if: ${{ github.event.inputs.e2e_base_url == '' }}
        run: pnpm --filter "@workspace/db" run push

      - name: Boot api-server
        if: ${{ github.event.inputs.e2e_base_url == '' }}
        env:
          PORT: "8000"
          NODE_ENV: production
          # NOTE: real auth, HubSpot, and email integrations are not
          # configured here; tests must scope to public routes.
        run: |
          pnpm --filter "@workspace/api-server" run build
          pnpm --filter "@workspace/api-server" run start &
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/healthz >/dev/null; then
              echo "api-server up"
              exit 0
            fi
            sleep 2
          done
          echo "api-server did not start in time" >&2
          exit 1

      - name: Build + preview synozur
        if: ${{ github.event.inputs.e2e_base_url == '' }}
        env:
          PORT: "5000"
          BASE_PATH: "/"
          # Wire /api/*, /.well-known/*, /oauth/* on the synozur preview
          # server through to the api-server, mirroring the platform's
          # production reverse proxy. Without this, the SPA's runtime
          # API calls (e.g. polaris-collateral-sync.spec.ts admin flow,
          # /api/auth/me, /api/auth/config) hit the static preview and
          # 404. The vite preview honours `preview.proxy` when this env
          # var is set — see artifacts/synozur/vite.config.ts.
          E2E_API_PROXY_TARGET: "http://localhost:8000"
        run: |
          pnpm --filter "@workspace/synozur" run build
          pnpm --filter "@workspace/synozur" run serve &
          for i in {1..30}; do
            if curl -sf http://localhost:5000/ >/dev/null; then
              echo "synozur up"
              exit 0
            fi
            sleep 2
          done
          echo "synozur did not start in time" >&2
          exit 1

      - name: Run Playwright (services + axe + polaris collateral sync)
        # The polaris-collateral-sync suite (#185) self-skips when
        # E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD are unset.
        #
        # We deliberately only forward those secrets when the run
        # targets an external `e2e_base_url` — i.e. a stack the
        # operator has provisioned with a verified admin user. The
        # local-stack mode (blank input) brings up an empty Postgres
        # via `pnpm --filter @workspace/db run push` and does not
        # seed any admin/editor account, so attempting login here
        # would always fail. Letting the suite self-skip in that
        # mode keeps the gate green and signals to operators that
        # they need to point at a provisioned URL to actually
        # exercise the admin flow.
        env:
          E2E_ADMIN_EMAIL: ${{ github.event.inputs.e2e_base_url != '' && secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ github.event.inputs.e2e_base_url != '' && secrets.E2E_ADMIN_PASSWORD || '' }}
        run: pnpm --filter "@workspace/synozur" run test:e2e

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --config=./lighthouserc.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/synozur/playwright-report
          retention-days: 14
