<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Transform Your Business with The Synozur Alliance | Strategic Advisory Services</title>
    <link rel="icon" type="image/png" sizes="1400x1400" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="alternate" type="application/rss+xml" title="The Synozur Alliance — The Feed" href="/api/insights/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Pre-hydration: apply the user's saved theme to <html> BEFORE React mounts
      // so the body background never flashes light during route transitions or
      // initial paint. Mirrors the logic in src/context/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("synozur-theme");
          var theme = stored === "light" ? "light" : "dark";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
